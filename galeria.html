<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería - Mi Web</title>
    <style>
        body {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
            background: linear-gradient(45deg, darkblue, red, green, blue);
            background-size: 400% 400%;
            animation: fondoAnimado 20s ease infinite;
        }

        @keyframes fondoAnimado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* CONTENEDOR DE LAS IMÁGENES */
        .cuadrilla-fotos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 10px;
        }

        /* TARJETA DE CADA FOTO */
        .tarjeta-foto {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            width: 220px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }

        .tarjeta-foto:hover {
            transform: scale(1.05);
        }

        .tarjeta-foto img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            background-color: rgba(0,0,0,0.2);
        }

        .tarjeta-foto p {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        /* BOTÓN VOLVER */
        .boton-volver {
            background-color: black;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .boton-volver:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <h1>📸 Mi Galería de Imágenes</h1>
    <p>Disfruta de mis 148 fotografías guardadas</p>

    <!-- Aquí es donde se meterán las 148 fotos por arte de magia -->
    <div class="cuadrilla-fotos" id="contenedor-galeria"></div>

    <!-- BOTÓN PARA REGRESAR A LA PÁGINA PRINCIPAL -->
    <div>
        <a href="index.html" class="boton-volver">
            ⬅️ Volver al Inicio
        </a>
    </div>

    <!-- EL CEREBRO AUTOMÁTICO -->
    <script>
        const totalFotos = 148; // Total de tus imágenes
        const galeria = document.getElementById('contenedor-galeria');

        // Bucle que lee las fotos del 1 al 148 automáticamente
        for (let i = 1; i <= totalFotos; i++) {
            // Creamos la cajita de la foto
            const tarjeta = document.createElement('div');
            tarjeta.className = 'tarjeta-foto';

            // Ponemos la imagen apuntando al nombre (1.jpg, 2.jpg...)
            tarjeta.innerHTML = `
                <img src="${i}.jpg" alt="Foto ${i}" loading="lazy">
                <p>Imagen ${i}</p>
            `;

            // La añadimos a la pantalla
            galeria.appendChild(tarjeta);
        }
    </script>

</body>
</html>
